name: Deploy Staging Frontend

on:
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-staging-frontend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build staging frontend
        working-directory: frontend
        run: npm run build -- --mode staging

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Test SSH connection
        env:
          SSH_HOST: ${{ secrets.STAGING_HOST }}
          SSH_USER: ${{ secrets.STAGING_USER }}
        run: |
          ssh \
            -p 22999 \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_HOST" \
            "echo SSH connection successful"

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Deploy frontend
        env:
          SSH_HOST: ${{ secrets.STAGING_HOST }}
          SSH_USER: ${{ secrets.STAGING_USER }}
        run: |
          rsync -avz --delete \
            -e "ssh -p 22999 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            frontend/dist/ \
            "$SSH_USER@$SSH_HOST:/home/httpworkstudyaus/staging.associates.workstudy-australia.com.au/"